[project]
name = "pip-speech"
version = "0.1.0"
description = "Pip's local GPU speech server: language routing, Indian-language ASR, transliteration"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# The GPU runtime: PyTorch for Blackwell (CUDA 12.8), Silero VAD, Whisper family
# (CTranslate2), and sherpa-onnx for ONNX exports (Qwen3-ASR, IndicConformer,
# Parakeet, SraVaani, Omnilingual).
gpu = [
  "torch>=2.7",
  "torchaudio>=2.7",
  "silero-vad>=5.1",
  "faster-whisper>=1.1",
  "sherpa-onnx>=1.12",
  "transformers>=4.45",
]
# Qwen3-ASR through its official package (transformers backend). It pins its own
# transformers version, so it can't share a venv with NeMo.
qwen = ["qwen-asr>=0.0.6"]
# Raw .nemo checkpoints (SraVaani, IndicConformer .nemo, fine-tunes before export).
nemo = ["nemo_toolkit[asr]>=2.3"]
# IndicXlit for romanized Hinglish (fairseq based; the backend has a rule-based fallback).
xlit = ["ai4bharat-transliteration>=1.1.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
conflicts = [[{ extra = "qwen" }, { extra = "nemo" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[project.scripts]
pip-speech = "pip_speech.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pip_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
